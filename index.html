<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUTMAT — Photo Collage &amp; Grid Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600&family=Playfair+Display:ital@0;1&family=Caveat:wght@600&family=Bebas+Neue&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --mat:#4C5B50;
  --mat-line:#5C6C60;
  --paper:#EFEBDE;
  --paper-raised:#F7F4EA;
  --ink:#221F1A;
  --ink-soft:#6E6858;
  --line:#DCD5C1;
  --amber:#C4881F;
  --trim:#C1442D;
  --trim-dark:#A2371F;
  --trim-soft:#F4DCD4;
  --radius-s:8px;
  --radius-m:14px;
  --shadow-s:0 1px 2px rgba(34,31,26,.18);
  --shadow-m:0 10px 28px rgba(20,24,20,.30);
  --font-display:'Space Mono',monospace;
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:var(--font-ui);background:var(--mat);overflow:hidden;color:var(--ink);}
button{font:inherit;}
input,select,textarea{font-family:inherit;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--trim);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
hr{border:none;border-top:1px solid var(--line);margin:2px 0;}

#app{height:100vh;display:flex;flex-direction:column;}

/* ---------- Toolbar ---------- */
.toolbar{min-height:64px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 20px;position:relative;flex:none;flex-wrap:wrap;}
.ruler-strip{position:absolute;left:0;right:0;bottom:-6px;height:6px;background-image:repeating-linear-gradient(90deg,var(--amber) 0 1px,transparent 1px 12px);opacity:.55;pointer-events:none;}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.5px;color:var(--ink);white-space:nowrap;margin-right:4px;}
.wordmark b{color:var(--trim);font-weight:700;}

.btn{font-family:var(--font-ui);font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .08s ease,background .15s ease;}
.btn:hover{background:#fff;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--trim);border-color:var(--trim);color:#fff;}
.btn-primary:hover{background:var(--trim-dark);}
.btn:disabled{opacity:.5;cursor:default;transform:none;}
.btn.active{background:var(--amber);border-color:var(--amber);color:#fff;}
.btn-icon{padding:8px 11px;font-size:15px;}

.size-group{display:flex;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-s);padding:2px;gap:2px;}
.size-btn{font-family:var(--font-ui);font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;}
.size-btn.active{background:var(--ink);color:var(--paper);}
.custom-size{display:none;align-items:center;gap:4px;font-family:var(--font-display);font-size:12px;color:var(--ink-soft);}
.custom-size.show{display:flex;}
.custom-size input{width:56px;font-family:var(--font-display);font-size:12px;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);}

.dropdown-wrap{position:relative;}
.dropdown-panel{position:absolute;top:calc(100% + 10px);left:0;width:270px;max-height:70vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow-m);padding:8px;display:none;flex-direction:column;gap:2px;z-index:200;}
.dropdown-panel.open{display:flex;}
.dd-header{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft);padding:12px 12px 4px;}
.dd-header:first-child{padding-top:6px;}
.dd-item{text-align:left;background:none;border:none;padding:10px 12px;border-radius:var(--radius-s);cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%;}
.dd-item:hover{background:var(--paper);}
.dd-name{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);}
.dd-desc{font-family:var(--font-ui);font-size:11px;color:var(--ink-soft);}
.dd-block{padding:8px 6px;display:flex;flex-direction:column;gap:10px;}

/* ---------- Workspace ---------- */
.workspace{flex:1;display:flex;min-height:0;}
.rail{width:240px;background:var(--paper);border-right:1px solid var(--line);padding:18px;overflow-y:auto;flex:none;}
.rail-right{border-right:none;border-left:1px solid var(--line);}
.rail-title{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin:0 0 12px;}

.dropzone{border:1.5px dashed var(--line);border-radius:var(--radius-m);padding:20px 12px;text-align:center;cursor:pointer;font-family:var(--font-ui);font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;transition:border-color .15s,color .15s,background .15s;}
.dropzone:hover,.dropzone.drag{border-color:var(--trim);color:var(--trim);background:var(--trim-soft);}
.tray{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tray-item{position:relative;aspect-ratio:1;border-radius:var(--radius-s);overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow-s);cursor:grab;}
.tray-item img{width:100%;height:100%;object-fit:cover;display:block;}
.tray-remove{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(34,31,26,.75);color:#fff;border:none;font-size:12px;cursor:pointer;line-height:1;}
.tray-empty{font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);grid-column:1/-1;}

.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:auto;padding:40px;
  background-color:var(--mat);
  background-image:linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);
  background-size:40px 40px;background-position:center;}
.canvas-wrapper{position:relative;flex:none;}
.canvas{position:relative;overflow:hidden;transform-origin:top left;box-shadow:var(--shadow-m);}
.crop{position:absolute;width:20px;height:20px;pointer-events:none;z-index:3;}
.crop::before,.crop::after{content:'';position:absolute;background:var(--amber);}
.crop::before{width:14px;height:2px;}
.crop::after{width:2px;height:14px;}
.crop-tl{left:-11px;top:-11px;}
.crop-tr{right:-11px;top:-11px;}
.crop-bl{left:-11px;bottom:-11px;}
.crop-br{right:-11px;bottom:-11px;}

/* ---------- Elements on canvas ---------- */
.element{position:absolute;box-sizing:border-box;}
.element.selected{outline:2px solid var(--trim);outline-offset:2px;}
.element.group-selected{outline:2px dashed var(--amber);outline-offset:2px;}
.frame{overflow:visible;}
.frame-clip{width:100%;height:100%;overflow:hidden;position:relative;background:var(--mat-line);}
.frame-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform-origin:center;user-select:none;pointer-events:none;}
.frame-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-soft);cursor:pointer;background:repeating-linear-gradient(45deg,rgba(76,91,80,.06) 0 10px,rgba(76,91,80,.12) 10px 20px);}
.frame-empty .plus{font-size:26px;font-weight:300;line-height:1;}
.frame-empty .add-label{font-size:11px;font-family:var(--font-ui);}

.shape-body{box-sizing:border-box;}

.panzoom-hint{position:absolute;left:0;right:0;bottom:0;background:rgba(34,31,26,.85);color:#fff;font-size:11px;font-family:var(--font-ui);padding:6px 8px;display:none;align-items:center;justify-content:space-between;gap:6px;z-index:4;}
.element.panzoom .panzoom-hint{display:flex;}
.done-btn{background:var(--trim);color:#fff;border:none;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;flex:none;}

.text{cursor:move;}
.text-content{width:100%;height:100%;display:flex;align-items:center;white-space:pre-wrap;word-wrap:break-word;overflow:visible;}
.text-edit{width:100%;height:100%;resize:none;border:1px dashed var(--trim);outline:none;background:rgba(255,255,255,.9);display:none;box-sizing:border-box;padding:2px;}

.handle{position:absolute;width:10px;height:10px;background:var(--paper);border:2px solid var(--trim);border-radius:2px;z-index:5;display:none;}
.handle-nw{left:-6px;top:-6px;cursor:nwse-resize;}
.handle-n{left:50%;top:-6px;margin-left:-5px;cursor:ns-resize;}
.handle-ne{right:-6px;top:-6px;cursor:nesw-resize;}
.handle-e{right:-6px;top:50%;margin-top:-5px;cursor:ew-resize;}
.handle-se{right:-6px;bottom:-6px;cursor:nwse-resize;}
.handle-s{left:50%;bottom:-6px;margin-left:-5px;cursor:ns-resize;}
.handle-sw{left:-6px;bottom:-6px;cursor:nesw-resize;}
.handle-w{left:-6px;top:50%;margin-top:-5px;cursor:ew-resize;}

.rotate-stem{position:absolute;left:50%;top:-24px;width:1px;height:24px;background:var(--amber);z-index:4;display:none;}
.rotate-handle{position:absolute;left:50%;top:-32px;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--amber);cursor:grab;z-index:5;display:none;}

.delete-btn{position:absolute;top:-12px;right:-12px;width:24px;height:24px;border-radius:50%;background:var(--trim);color:#fff;border:2px solid var(--paper);font-size:15px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:6;padding:0;}

.element.selected .handle,
.element.selected .rotate-stem,
.element.selected .rotate-handle{display:block;}
.element.selected .delete-btn{display:flex;}

.element.panzoom .handle,.element.panzoom .rotate-stem,.element.panzoom .rotate-handle,.element.panzoom .delete-btn,
.element.editing-text .handle,.element.editing-text .rotate-stem,.element.editing-text .rotate-handle,.element.editing-text .delete-btn{display:none;}

.guide{position:absolute;background:var(--amber);z-index:50;display:none;pointer-events:none;}
.guide-v{top:0;bottom:0;width:1px;}
.guide-h{left:0;right:0;height:1px;}

/* ---------- Properties panel ---------- */
.props-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:6px;}
.props-type{font-family:var(--font-ui);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);}
.props-header-btns{display:flex;gap:6px;}
.props-delete{font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--trim);background:none;border:1px solid var(--trim-soft);padding:5px 10px;border-radius:6px;cursor:pointer;}
.props-delete:hover{background:var(--trim-soft);}
.props-dup{font-family:var(--font-ui);font-size:12px;font-weight:600;color:var(--ink);background:none;border:1px solid var(--line);padding:5px 10px;border-radius:6px;cursor:pointer;}
.props-dup:hover{background:var(--paper);}
.props-section{padding:14px 0;border-top:1px solid var(--line);}
.props-section:first-of-type{border-top:none;padding-top:0;}
.props-row{display:flex;gap:8px;margin-bottom:10px;}
.props-row label{flex:1;font-family:var(--font-display);font-size:10px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;}
.props-row input[type=number]{font-family:var(--font-display);font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%;}
.props-slider{display:block;font-family:var(--font-ui);font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;}
.props-slider input{width:100%;margin-top:4px;accent-color:var(--trim);}
.props-color{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-ui);font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;}
.props-color input{width:36px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer;}
.props-check{display:flex;align-items:center;gap:8px;font-family:var(--font-ui);font-size:12.5px;color:var(--ink);margin-bottom:8px;}
.props-row-btns{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.props-row-btns button{flex:1;min-width:38px;padding:7px 6px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-family:var(--font-ui);font-size:12px;}
.props-row-btns button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.props-row-btns button:disabled{opacity:.4;cursor:default;}
.props-layers{display:flex;gap:6px;flex-wrap:wrap;}
.props-layers button{flex:1;min-width:70px;padding:7px 4px;font-size:11px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-family:var(--font-ui);}
.props-label{font-family:var(--font-ui);font-size:12px;font-weight:700;color:var(--ink);margin:0 0 8px;}
.props-hint{font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);line-height:1.5;margin:0 0 8px;}
.props-empty-title{font-family:var(--font-ui);font-weight:700;font-size:13px;color:var(--ink);margin:0 0 6px;}
.props-empty-body{font-family:var(--font-ui);font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 14px;}
.props-tips{margin:0;padding-left:16px;font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);line-height:1.9;}
#tFont{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-family:var(--font-ui);font-size:12.5px;background:#fff;margin-top:4px;}

@media (max-width:900px){
  .workspace{flex-direction:column;overflow-y:auto;}
  .rail{width:auto;border:none;border-bottom:1px solid var(--line);max-height:220px;}
  .rail-right{border-bottom:none;border-top:1px solid var(--line);}
  .tray{grid-template-columns:repeat(4,1fr);}
  .toolbar{padding:10px 14px;}
}
</style>
</head>
<body>
<div id="app">

  <header class="toolbar">
    <span class="wordmark">CUT<b>MAT</b><span style="color:var(--trim)">.</span></span>

    <div class="size-group" id="sizeGroup">
      <button type="button" class="size-btn active" data-size="square">Square</button>
      <button type="button" class="size-btn" data-size="portrait">Portrait</button>
      <button type="button" class="size-btn" data-size="story">Story</button>
      <button type="button" class="size-btn" data-size="landscape">Landscape</button>
      <button type="button" class="size-btn" data-size="custom">Custom</button>
    </div>
    <div class="custom-size" id="customSize">
      <input type="number" id="customW" value="1080" min="200" max="4000">×<input type="number" id="customH" value="1080" min="200" max="4000">
    </div>

    <div class="dropdown-wrap">
      <button type="button" class="btn" id="layoutsBtn">Layouts ▾</button>
      <div class="dropdown-panel" id="layoutsPanel"></div>
    </div>

    <div class="dropdown-wrap">
      <button type="button" class="btn" id="addBtn">+ Add ▾</button>
      <div class="dropdown-panel" id="addPanel">
        <button type="button" class="dd-item" id="addFrameBtn"><span class="dd-name">Photo frame</span><span class="dd-desc">Drop a photo into a box</span></button>
        <button type="button" class="dd-item" id="addRectBtn"><span class="dd-name">Rectangle</span><span class="dd-desc">Solid color block</span></button>
        <button type="button" class="dd-item" id="addEllipseBtn"><span class="dd-name">Ellipse</span><span class="dd-desc">Solid color circle / oval</span></button>
        <button type="button" class="dd-item" id="addTextBtn"><span class="dd-name">Text</span><span class="dd-desc">A caption or label</span></button>
      </div>
    </div>

    <button type="button" class="btn" id="groupModeBtn" title="Select several items at once to align or distribute them">Multi-select</button>
    <button type="button" class="btn btn-icon" id="undoBtn" title="Undo (Ctrl+Z)" disabled>↶</button>
    <button type="button" class="btn btn-icon" id="redoBtn" title="Redo (Ctrl+Y)" disabled>↷</button>

    <div style="flex:1"></div>

    <div class="dropdown-wrap">
      <button type="button" class="btn" id="bgBtn">Background ▾</button>
      <div class="dropdown-panel" id="bgPanel">
        <div class="dd-block">
          <label class="props-color" style="margin:0;">Color<input type="color" id="bgColor" value="#ffffff"></label>
          <button type="button" class="btn" id="bgImageBtn" style="width:100%">Set background image</button>
          <button type="button" class="btn" id="bgImageClear" style="width:100%">Remove background image</button>
        </div>
      </div>
    </div>
    <div class="dropdown-wrap">
      <button type="button" class="btn" id="fileBtn">File ▾</button>
      <div class="dropdown-panel" id="filePanel">
        <div class="dd-block">
          <button type="button" class="btn" id="saveProjectBtn" style="width:100%">Save project (.json)</button>
          <button type="button" class="btn" id="loadProjectBtn" style="width:100%">Load project</button>
          <hr>
          <button type="button" class="btn" id="resetBtn" style="width:100%;color:var(--trim);">Reset canvas</button>
        </div>
      </div>
    </div>
    <button type="button" class="btn btn-primary" id="exportBtn">Download PNG</button>
    <div class="ruler-strip"></div>
  </header>

  <div class="workspace">
    <aside class="rail rail-left">
      <p class="rail-title">Photos</p>
      <div class="dropzone" id="dropzone">Drop photos here, or click to browse.</div>
      <div class="tray" id="tray"></div>
    </aside>

    <main class="stage" id="stage">
      <div class="canvas-wrapper" id="canvasWrapper">
        <div class="crop crop-tl"></div>
        <div class="crop crop-tr"></div>
        <div class="crop crop-bl"></div>
        <div class="crop crop-br"></div>
        <div class="canvas" id="canvas">
          <div class="guide guide-v" id="guideV"></div>
          <div class="guide guide-h" id="guideH"></div>
        </div>
      </div>
    </main>

    <aside class="rail rail-right">
      <p class="rail-title">Properties</p>
      <div id="propsRail"></div>
    </aside>
  </div>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <input type="file" id="frameFileInput" accept="image/*" hidden>
  <input type="file" id="bgFileInput" accept="image/*" hidden>
  <input type="file" id="loadProjectInput" accept="application/json,.json" hidden>
</div>

<script>
(function(){
"use strict";

/* ================= State ================= */
const state = {
  els: [],
  nodes: {},
  selectedId: null,
  nextZ: 1,
  counter: 1,
  images: [],
  canvasW: 1080,
  canvasH: 1080,
  scale: 1,
  panZoomId: null,
  editingTextId: null,
  drag: null,
  groupMode: false,
  groupIds: new Set(),
  history: [],
  historyIndex: -1,
  suppressHistory: false
};
let pendingFrameTarget = null;

/* ================= DOM refs ================= */
function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function $$(sel, ctx){ return Array.from((ctx||document).querySelectorAll(sel)); }

const canvasEl = $('#canvas');
const wrapperEl = $('#canvasWrapper');
const stageEl = $('#stage');
const propsRail = $('#propsRail');
const trayEl = $('#tray');
const fileInput = $('#fileInput');
const frameFileInput = $('#frameFileInput');
const bgFileInput = $('#bgFileInput');
const loadProjectInput = $('#loadProjectInput');
const guideV = $('#guideV');
const guideH = $('#guideH');
const dropzone = $('#dropzone');

/* ================= Utilities ================= */
function uid(){ return 'el' + (state.counter++); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function getEl(id){ return state.els.find(function(e){ return e.id===id; }); }
function readAsDataURL(file){
  return new Promise(function(resolve,reject){
    const r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function loadImg(src){
  return new Promise(function(resolve,reject){
    const img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = reject;
    img.src = src;
  });
}
function debounce(fn, ms){
  let t;
  return function(){
    const args = arguments;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(null,args); }, ms);
  };
}
function closeDropdowns(){ $$('.dropdown-panel').forEach(function(p){ p.classList.remove('open'); }); }

/* ================= Element factories ================= */
function addFrame(x,y,w,h){
  const el = {
    id: uid(), type:'frame', x:x, y:y, w:w, h:h,
    z: state.nextZ++, opacity:1, rotation:0,
    radius:0, borderW:0, borderColor:'#221F1A', shadow:false,
    imageSrc:null, imgNatW:0, imgNatH:0, imgPosX:50, imgPosY:50, imgZoom:1,
    brightness:100, contrast:100, saturate:100, grayscale:0
  };
  state.els.push(el);
  return el;
}
function addText(x,y,w,h,content){
  const el = {
    id: uid(), type:'text', x:x, y:y, w:w, h:h,
    z: state.nextZ++, opacity:1, rotation:0,
    content: content!==undefined ? content : 'Double-click to edit',
    font:'Inter', size:32, color:'#221F1A', align:'left',
    bold:false, italic:false, letterSpacing:0,
    bg:false, bgColor:'#FFFFFF', bgRadius:8
  };
  state.els.push(el);
  return el;
}
function addShape(x,y,w,h,shapeKind){
  const el = {
    id: uid(), type:'shape', shapeKind: shapeKind||'rect', x:x, y:y, w:w, h:h,
    z: state.nextZ++, opacity:1, rotation:0,
    fill:'#C1442D', borderW:0, borderColor:'#221F1A', radius:0, shadow:false, backdropBlur:0
  };
  state.els.push(el);
  return el;
}
function tagLast(props){ Object.assign(state.els[state.els.length-1], props); }

/* ================= Node building ================= */
const HANDLE_DIRS = ['nw','n','ne','e','se','s','sw','w'];
function handlesHTML(){
  return HANDLE_DIRS.map(function(d){ return '<div class="handle handle-'+d+'" data-dir="'+d+'"></div>'; }).join('');
}
function rotateHandleHTML(){
  return '<div class="rotate-stem"></div><div class="rotate-handle" title="Drag to rotate, double-click to reset"></div>';
}

function attachElementEvents(node, id){
  node.addEventListener('pointerdown', function(e){
    if(e.target.closest('.handle') || e.target.closest('.rotate-handle') || e.target.closest('.delete-btn') || e.target.closest('.done-btn')) return;
    if(e.target.tagName === 'TEXTAREA') return;
    e.stopPropagation();
    if(state.groupMode){
      if(state.groupIds.has(id)){ state.groupIds.delete(id); } else { state.groupIds.add(id); }
      render();
      renderProps();
      return;
    }
    selectEl(id);
    const el = getEl(id);
    if(!el) return;
    if(el.type==='frame' && state.panZoomId===id){
      startPanImage(e, id);
    } else {
      startDrag(e, id);
    }
  });
  node.addEventListener('dblclick', function(e){
    if(state.groupMode) return;
    if(e.target.closest('.handle') || e.target.closest('.rotate-handle') || e.target.closest('.delete-btn')) return;
    const el = getEl(id);
    if(!el) return;
    if(el.type==='frame'){
      e.stopPropagation();
      if(el.imageSrc){ enterPanZoom(id); } else { openFramePicker(id); }
    } else if(el.type==='text'){
      e.stopPropagation();
      enterTextEdit(id);
    }
  });
  const delBtn = node.querySelector('.delete-btn');
  delBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  delBtn.addEventListener('click', function(e){ e.stopPropagation(); deleteEl(id); pushHistory(); });

  $$('.handle', node).forEach(function(h){
    h.addEventListener('pointerdown', function(e){
      e.stopPropagation();
      startResize(e, id, h.dataset.dir);
    });
  });
  const rotHandle = node.querySelector('.rotate-handle');
  if(rotHandle){
    rotHandle.addEventListener('pointerdown', function(e){ e.stopPropagation(); startRotate(e, id); });
    rotHandle.addEventListener('dblclick', function(e){
      e.stopPropagation();
      const el = getEl(id);
      if(el){ el.rotation = 0; updateNode(el); renderProps(); pushHistory(); }
    });
  }
  const doneBtn = node.querySelector('.done-btn');
  if(doneBtn){
    doneBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    doneBtn.addEventListener('click', function(e){ e.stopPropagation(); exitPanZoom(); });
  }
}

function buildFrameNode(id){
  const node = document.createElement('div');
  node.className = 'element frame';
  node.dataset.id = id;
  node.innerHTML =
    '<div class="frame-clip">' +
      '<img class="frame-img" draggable="false" alt="">' +
      '<div class="frame-empty"><span class="plus">+</span><span class="add-label">Add photo</span></div>' +
    '</div>' +
    '<div class="panzoom-hint"><span>Drag to reposition · Scroll to zoom</span><button type="button" class="done-btn">Done</button></div>' +
    '<button type="button" class="delete-btn" title="Delete">×</button>' +
    rotateHandleHTML() + handlesHTML();
  attachElementEvents(node, id);
  return node;
}
function buildTextNode(id){
  const node = document.createElement('div');
  node.className = 'element text';
  node.dataset.id = id;
  node.innerHTML =
    '<div class="text-content"></div>' +
    '<textarea class="text-edit" spellcheck="false"></textarea>' +
    '<button type="button" class="delete-btn" title="Delete">×</button>' +
    rotateHandleHTML() + handlesHTML();
  attachElementEvents(node, id);
  const ta = node.querySelector('.text-edit');
  ta.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  ta.addEventListener('keydown', function(e){
    e.stopPropagation();
    if(e.key==='Escape'){ ta.blur(); }
  });
  ta.addEventListener('blur', function(){
    const el = getEl(id);
    if(el){ el.content = ta.value || ''; }
    state.editingTextId = null;
    render();
    pushHistory();
  });
  return node;
}
function buildShapeNode(id){
  const node = document.createElement('div');
  node.className = 'element shape';
  node.dataset.id = id;
  node.innerHTML =
    '<div class="shape-body"></div>' +
    '<button type="button" class="delete-btn" title="Delete">×</button>' +
    rotateHandleHTML() + handlesHTML();
  attachElementEvents(node, id);
  return node;
}

/* ================= Sync data -> DOM ================= */
function updateNode(el){
  const node = state.nodes[el.id];
  if(!node) return;
  const isTextEditing = el.type==='text' && state.editingTextId===el.id;
  node.style.left = el.x+'px';
  node.style.top = el.y+'px';
  node.style.width = el.w+'px';
  node.style.height = el.h+'px';
  node.style.zIndex = el.z;
  node.style.opacity = el.opacity;
  node.style.transform = isTextEditing ? 'none' : 'rotate('+(el.rotation||0)+'deg)';
  node.classList.toggle('selected', state.selectedId===el.id);
  node.classList.toggle('group-selected', state.groupIds.has(el.id));
  node.classList.toggle('editing-text', isTextEditing);
  node.classList.toggle('export-hidden', !!el.guideOnly);
  if(el.type==='frame'){ updateFrameVisual(node, el); }
  else if(el.type==='text'){ updateTextVisual(node, el); }
  else if(el.type==='shape'){ updateShapeVisual(node, el); }
}
function frameFilterCSS(el){
  return 'brightness('+el.brightness+'%) contrast('+el.contrast+'%) saturate('+el.saturate+'%) grayscale('+el.grayscale+'%)';
}
function updateFrameVisual(node, el){
  node.style.borderRadius = el.radius+'px';
  node.style.boxShadow = el.shadow ? 'var(--shadow-m)' : 'none';
  node.classList.toggle('panzoom', state.panZoomId===el.id);
  const clip = node.querySelector('.frame-clip');
  clip.style.borderRadius = el.radius+'px';
  clip.style.border = el.borderW>0 ? (el.borderW+'px solid '+el.borderColor) : 'none';
  const img = node.querySelector('.frame-img');
  const empty = node.querySelector('.frame-empty');
  if(el.imageSrc){
    img.style.display='block';
    if(img.getAttribute('src')!==el.imageSrc) img.src = el.imageSrc;
    img.style.objectPosition = el.imgPosX+'% '+el.imgPosY+'%';
    img.style.transform = 'scale('+el.imgZoom+')';
    img.style.filter = frameFilterCSS(el);
    empty.style.display='none';
  } else {
    img.style.display='none';
    empty.style.display='flex';
  }
}
function updateTextVisual(node, el){
  const disp = node.querySelector('.text-content');
  const ta = node.querySelector('.text-edit');
  const isEditing = state.editingTextId === el.id;
  disp.style.display = isEditing ? 'none' : 'flex';
  ta.style.display = isEditing ? 'block' : 'none';
  const justify = el.align==='center' ? 'center' : (el.align==='right' ? 'flex-end' : 'flex-start');
  const fam = "'"+el.font+"'";
  [disp.style, ta.style].forEach(function(s){
    s.fontFamily = fam;
    s.fontSize = el.size+'px';
    s.color = el.color;
    s.fontWeight = el.bold ? '700' : '400';
    s.fontStyle = el.italic ? 'italic' : 'normal';
    s.textAlign = el.align;
    s.letterSpacing = el.letterSpacing+'px';
  });
  disp.style.justifyContent = justify;
  if(!isEditing) disp.textContent = el.content;
  if(document.activeElement!==ta) ta.value = el.content;
  node.style.background = el.bg ? el.bgColor : 'transparent';
  node.style.borderRadius = el.bg ? el.bgRadius+'px' : '0px';
  node.style.padding = el.bg ? '10px 14px' : '0px';
}
function updateShapeVisual(node, el){
  node.style.borderRadius = el.shapeKind==='ellipse' ? '50%' : (el.radius+'px');
  node.style.boxShadow = el.shadow ? 'var(--shadow-m)' : 'none';
  const body = node.querySelector('.shape-body');
  body.style.width='100%'; body.style.height='100%';
  body.style.borderRadius = 'inherit';
  body.style.background = el.fill;
  body.style.border = el.borderW>0 ? (el.borderW+'px solid '+el.borderColor) : 'none';
  const blur = el.backdropBlur ? 'blur('+el.backdropBlur+'px)' : 'none';
  body.style.backdropFilter = blur;
  body.style.webkitBackdropFilter = blur;
}

function render(){
  const activeIds = {};
  state.els.forEach(function(e){ activeIds[e.id]=true; });
  Object.keys(state.nodes).forEach(function(id){
    if(!activeIds[id]){ state.nodes[id].remove(); delete state.nodes[id]; }
  });
  state.els.forEach(function(el){
    let node = state.nodes[el.id];
    if(!node){
      node = el.type==='frame' ? buildFrameNode(el.id) : (el.type==='text' ? buildTextNode(el.id) : buildShapeNode(el.id));
      state.nodes[el.id] = node;
      canvasEl.appendChild(node);
    }
    updateNode(el);
  });
}

/* ================= Selection ================= */
function selectEl(id){
  if(state.selectedId===id) return;
  if(state.editingTextId && state.editingTextId!==id){
    const n = state.nodes[state.editingTextId];
    if(n){ const ta = n.querySelector('.text-edit'); if(ta) ta.blur(); }
  }
  if(state.panZoomId && state.panZoomId!==id) exitPanZoom(false);
  state.selectedId = id;
  render();
  renderProps();
}
canvasEl.addEventListener('pointerdown', function(e){
  if(e.target===canvasEl){ selectEl(null); }
});

function deleteEl(id){
  state.els = state.els.filter(function(e){ return e.id!==id; });
  if(state.nodes[id]){ state.nodes[id].remove(); delete state.nodes[id]; }
  if(state.selectedId===id) state.selectedId=null;
  if(state.panZoomId===id) state.panZoomId=null;
  if(state.editingTextId===id) state.editingTextId=null;
  state.groupIds.delete(id);
  renderProps();
}

function enterTextEdit(id){
  state.editingTextId = id;
  render();
  requestAnimationFrame(function(){
    const node = state.nodes[id];
    if(!node) return;
    const ta = node.querySelector('.text-edit');
    ta.focus();
    ta.select();
  });
}
function enterPanZoom(id){ state.panZoomId = id; render(); }
function exitPanZoom(doRender){
  const wasActive = !!state.panZoomId;
  state.panZoomId = null;
  if(doRender!==false) render();
  if(wasActive) pushHistory();
}
canvasEl.addEventListener('wheel', function(e){
  if(!state.panZoomId) return;
  const el = getEl(state.panZoomId);
  if(!el) return;
  e.preventDefault();
  el.imgZoom = clamp(el.imgZoom + (e.deltaY>0 ? -0.05 : 0.05), 1, 4);
  updateNode(el);
  renderProps();
}, {passive:false});

function toggleGroupMode(){
  state.groupMode = !state.groupMode;
  if(state.groupMode){ selectEl(null); } else { state.groupIds.clear(); }
  $('#groupModeBtn').classList.toggle('active', state.groupMode);
  render();
  renderProps();
}
$('#groupModeBtn').addEventListener('click', toggleGroupMode);

document.addEventListener('keydown', function(e){
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const typing = tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';

  if(e.key==='Escape'){
    if(state.editingTextId){ const n=state.nodes[state.editingTextId]; if(n) n.querySelector('.text-edit').blur(); }
    else if(state.panZoomId){ exitPanZoom(); }
    else if(state.groupMode){ toggleGroupMode(); }
    else if(state.selectedId){ selectEl(null); }
    return;
  }
  if(typing) return;

  if((e.ctrlKey||e.metaKey) && !e.altKey){
    if(e.key==='z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if((e.key==='z' && e.shiftKey) || e.key==='y'){ e.preventDefault(); redo(); return; }
    if(e.key==='d'){ e.preventDefault(); duplicateSelected(); return; }
  }

  if((e.key==='Delete' || e.key==='Backspace')){
    if(state.groupMode && state.groupIds.size>0){
      e.preventDefault();
      Array.from(state.groupIds).forEach(function(id){ deleteEl(id); });
      state.groupIds.clear();
      renderProps();
      pushHistory();
    } else if(state.selectedId){
      e.preventDefault();
      deleteEl(state.selectedId);
      pushHistory();
    }
    return;
  }

  const arrowMap = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
  if(arrowMap[e.key]){
    const ids = state.groupMode ? Array.from(state.groupIds) : (state.selectedId ? [state.selectedId] : []);
    if(ids.length>0){
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      const dx = arrowMap[e.key][0]*step, dy = arrowMap[e.key][1]*step;
      ids.forEach(function(id){
        const el = getEl(id);
        if(el){ el.x += dx; el.y += dy; updateNode(el); }
      });
      pushHistoryDebounced();
    }
  }
});

/* ================= Drag / Resize / Rotate / Pan ================= */
function startDrag(e, id){
  const el = getEl(id);
  state.drag = { kind:'move', id:id, startX:e.clientX, startY:e.clientY, origX:el.x, origY:el.y, moved:false };
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
}
function startResize(e, id, dir){
  const el = getEl(id);
  state.drag = { kind:'resize', id:id, dir:dir, startX:e.clientX, startY:e.clientY, origX:el.x, origY:el.y, origW:el.w, origH:el.h };
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
}
function startRotate(e, id){
  const node = state.nodes[id];
  const el = getEl(id);
  const rect = node.getBoundingClientRect();
  const centerX = rect.left + rect.width/2;
  const centerY = rect.top + rect.height/2;
  const startAngle = Math.atan2(e.clientY-centerY, e.clientX-centerX);
  state.drag = { kind:'rotate', id:id, centerX:centerX, centerY:centerY, startAngle:startAngle, origRotation:el.rotation||0 };
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
}
function startPanImage(e, id){
  const el = getEl(id);
  state.drag = { kind:'pan', id:id, startX:e.clientX, startY:e.clientY, origPosX:el.imgPosX, origPosY:el.imgPosY };
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
}
function onPointerMove(e){
  const d = state.drag;
  if(!d) return;
  const el = getEl(d.id);
  if(!el) return;

  if(d.kind==='rotate'){
    const angle = Math.atan2(e.clientY-d.centerY, e.clientX-d.centerX);
    let deg = d.origRotation + (angle-d.startAngle)*180/Math.PI;
    if(e.shiftKey){ deg = Math.round(deg/15)*15; }
    el.rotation = deg;
    updateNode(el);
    return;
  }

  const dx = (e.clientX - d.startX)/state.scale;
  const dy = (e.clientY - d.startY)/state.scale;
  if(Math.abs(e.clientX-d.startX)>3 || Math.abs(e.clientY-d.startY)>3) d.moved = true;

  if(d.kind==='move'){
    const snapped = applySnap(el, d.origX+dx, d.origY+dy);
    el.x = snapped.x; el.y = snapped.y;
    updateNode(el);
  } else if(d.kind==='resize'){
    const rad = (el.rotation||0) * Math.PI/180;
    const localDx = dx*Math.cos(rad) + dy*Math.sin(rad);
    const localDy = -dx*Math.sin(rad) + dy*Math.cos(rad);
    resizeCompute(el, d, localDx, localDy, e.shiftKey);
    updateNode(el);
  } else if(d.kind==='pan'){
    const sensX = 110/(el.w*el.imgZoom);
    const sensY = 110/(el.h*el.imgZoom);
    el.imgPosX = clamp(d.origPosX - dx*sensX, 0, 100);
    el.imgPosY = clamp(d.origPosY - dy*sensY, 0, 100);
    updateNode(el);
  }
}
function onPointerUp(){
  const d = state.drag;
  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  hideGuides();
  if(!d){ return; }
  const el = getEl(d.id);
  if(d.kind==='move' && !d.moved && el && el.type==='frame' && !el.imageSrc){
    openFramePicker(d.id);
  }
  state.drag = null;
  renderProps();
  pushHistory();
}
function resizeCompute(el, d, dx, dy, shift){
  const MIN = 30;
  let x=d.origX, y=d.origY, w=d.origW, h=d.origH;
  const dir = d.dir;
  if(dir.indexOf('e')>-1) w = d.origW + dx;
  if(dir.indexOf('s')>-1) h = d.origH + dy;
  if(dir.indexOf('w')>-1){ w = d.origW - dx; x = d.origX + dx; }
  if(dir.indexOf('n')>-1){ h = d.origH - dy; y = d.origY + dy; }

  if(shift && dir.length===2){
    const ratio = d.origW/d.origH;
    if(Math.abs(dx) > Math.abs(dy)){ h = w/ratio; } else { w = h*ratio; }
    if(dir.indexOf('w')>-1) x = d.origX + (d.origW - w);
    if(dir.indexOf('n')>-1) y = d.origY + (d.origH - h);
  }
  if(w < MIN){ if(dir.indexOf('w')>-1) x = d.origX + d.origW - MIN; w = MIN; }
  if(h < MIN){ if(dir.indexOf('n')>-1) y = d.origY + d.origH - MIN; h = MIN; }
  el.x=x; el.y=y; el.w=w; el.h=h;
}

/* ---- snapping ---- */
const SNAP = 10;
function applySnap(el, nx, ny){
  hideGuides();
  let x=nx, y=ny;
  const cx = nx+el.w/2, cy = ny+el.h/2;
  if(Math.abs(cx-state.canvasW/2)<SNAP){ x = state.canvasW/2-el.w/2; showGuideV(state.canvasW/2); }
  if(Math.abs(cy-state.canvasH/2)<SNAP){ y = state.canvasH/2-el.h/2; showGuideH(state.canvasH/2); }
  if(Math.abs(nx)<SNAP){ x=0; showGuideV(0); }
  if(Math.abs(nx+el.w-state.canvasW)<SNAP){ x=state.canvasW-el.w; showGuideV(state.canvasW); }
  if(Math.abs(ny)<SNAP){ y=0; showGuideH(0); }
  if(Math.abs(ny+el.h-state.canvasH)<SNAP){ y=state.canvasH-el.h; showGuideH(state.canvasH); }
  return {x:x, y:y};
}
function showGuideV(x){ guideV.style.left = x+'px'; guideV.style.display='block'; }
function showGuideH(y){ guideH.style.top = y+'px'; guideH.style.display='block'; }
function hideGuides(){ guideV.style.display='none'; guideH.style.display='none'; }

/* ================= Undo / Redo ================= */
function snapshot(){
  return JSON.stringify({
    els: state.els, canvasW: state.canvasW, canvasH: state.canvasH,
    bg: canvasEl.style.background, bgImage: canvasEl.style.backgroundImage,
    nextZ: state.nextZ, counter: state.counter
  });
}
function pushHistory(){
  if(state.suppressHistory) return;
  const snap = snapshot();
  if(state.historyIndex>=0 && state.history[state.historyIndex]===snap) return;
  state.history = state.history.slice(0, state.historyIndex+1);
  state.history.push(snap);
  state.historyIndex = state.history.length-1;
  const MAXHIST = 60;
  if(state.history.length>MAXHIST){ state.history.shift(); state.historyIndex--; }
  updateUndoRedoButtons();
}
const pushHistoryDebounced = debounce(pushHistory, 400);
function restoreSnapshot(snapStr){
  const data = JSON.parse(snapStr);
  state.suppressHistory = true;
  state.els = data.els;
  state.canvasW = data.canvasW; state.canvasH = data.canvasH;
  state.nextZ = data.nextZ; state.counter = data.counter;
  state.selectedId = null; state.panZoomId=null; state.editingTextId=null;
  state.groupIds.clear();
  $$('.size-btn').forEach(function(b){ b.classList.toggle('active', false); });
  recalcScale();
  canvasEl.style.background = data.bg || '#ffffff';
  canvasEl.style.backgroundImage = data.bgImage || '';
  render();
  renderProps();
  state.suppressHistory = false;
}
function undo(){
  if(state.historyIndex<=0) return;
  state.historyIndex--;
  restoreSnapshot(state.history[state.historyIndex]);
  updateUndoRedoButtons();
}
function redo(){
  if(state.historyIndex>=state.history.length-1) return;
  state.historyIndex++;
  restoreSnapshot(state.history[state.historyIndex]);
  updateUndoRedoButtons();
}
function updateUndoRedoButtons(){
  $('#undoBtn').disabled = state.historyIndex<=0;
  $('#redoBtn').disabled = state.historyIndex>=state.history.length-1;
}
$('#undoBtn').addEventListener('click', undo);
$('#redoBtn').addEventListener('click', redo);

/* ================= Duplicate ================= */
function duplicateSelected(){
  const ids = state.groupMode ? Array.from(state.groupIds) : (state.selectedId ? [state.selectedId] : []);
  if(ids.length===0) return;
  const newIds = [];
  ids.forEach(function(id){
    const el = getEl(id);
    if(!el) return;
    const copy = JSON.parse(JSON.stringify(el));
    copy.id = uid();
    copy.x += 24; copy.y += 24;
    copy.z = ++state.nextZ;
    state.els.push(copy);
    newIds.push(copy.id);
  });
  render();
  if(state.groupMode){ state.groupIds = new Set(newIds); renderProps(); }
  else if(newIds.length===1){ selectEl(newIds[0]); }
  pushHistory();
}

/* ================= Align / Distribute ================= */
function alignSelection(mode){
  const ids = state.groupMode ? Array.from(state.groupIds) : (state.selectedId ? [state.selectedId] : []);
  if(ids.length===0) return;
  if(ids.length===1){
    const el = getEl(ids[0]);
    if(!el) return;
    if(mode==='left') el.x = 0;
    if(mode==='centerH') el.x = (state.canvasW-el.w)/2;
    if(mode==='right') el.x = state.canvasW-el.w;
    if(mode==='top') el.y = 0;
    if(mode==='middleV') el.y = (state.canvasH-el.h)/2;
    if(mode==='bottom') el.y = state.canvasH-el.h;
    updateNode(el);
  } else {
    const items = ids.map(getEl).filter(Boolean);
    const minX = Math.min.apply(null, items.map(function(e){return e.x;}));
    const minY = Math.min.apply(null, items.map(function(e){return e.y;}));
    const maxX = Math.max.apply(null, items.map(function(e){return e.x+e.w;}));
    const maxY = Math.max.apply(null, items.map(function(e){return e.y+e.h;}));
    items.forEach(function(el){
      if(mode==='left') el.x = minX;
      if(mode==='centerH') el.x = (minX+maxX)/2 - el.w/2;
      if(mode==='right') el.x = maxX - el.w;
      if(mode==='top') el.y = minY;
      if(mode==='middleV') el.y = (minY+maxY)/2 - el.h/2;
      if(mode==='bottom') el.y = maxY - el.h;
      updateNode(el);
    });
  }
  pushHistory();
  renderProps();
}
function distributeSelection(axis){
  const ids = Array.from(state.groupIds);
  if(ids.length<3) return;
  const items = ids.map(getEl).filter(Boolean);
  if(axis==='h'){
    items.sort(function(a,b){ return a.x-b.x; });
    const first=items[0], last=items[items.length-1];
    const totalSpan = (last.x+last.w) - first.x;
    const totalW = items.reduce(function(s,e){ return s+e.w; },0);
    const gap = (totalSpan-totalW)/(items.length-1);
    let cursor = first.x+first.w+gap;
    items.forEach(function(e,i){
      if(i===0 || i===items.length-1) return;
      e.x = cursor; cursor += e.w+gap;
      updateNode(e);
    });
  } else {
    items.sort(function(a,b){ return a.y-b.y; });
    const first=items[0], last=items[items.length-1];
    const totalSpan = (last.y+last.h) - first.y;
    const totalH = items.reduce(function(s,e){ return s+e.h; },0);
    const gap = (totalSpan-totalH)/(items.length-1);
    let cursor = first.y+first.h+gap;
    items.forEach(function(e,i){
      if(i===0 || i===items.length-1) return;
      e.y = cursor; cursor += e.h+gap;
      updateNode(e);
    });
  }
  pushHistory();
  renderProps();
}

/* ================= Canvas size / scale ================= */
const SIZES = { square:{w:1080,h:1080}, portrait:{w:1080,h:1350}, story:{w:1080,h:1920}, landscape:{w:1920,h:1080} };
function setCanvasSize(w,h){ state.canvasW=w; state.canvasH=h; recalcScale(); }
function recalcScale(){
  const padding = 80;
  const availW = stageEl.clientWidth - padding;
  const availH = stageEl.clientHeight - padding;
  let s = Math.min(availW/state.canvasW, availH/state.canvasH);
  if(!isFinite(s) || s<=0) s = 1;
  s = Math.min(s, 1.4);
  state.scale = s;
  wrapperEl.style.width = (state.canvasW*s)+'px';
  wrapperEl.style.height = (state.canvasH*s)+'px';
  canvasEl.style.width = state.canvasW+'px';
  canvasEl.style.height = state.canvasH+'px';
  canvasEl.style.transform = 'scale('+s+')';
}
window.addEventListener('resize', debounce(recalcScale, 150));
window.addEventListener('load', recalcScale);

/* ================= Upload / tray ================= */
function addToTray(src,w,h){
  const item = { id:'img'+(state.counter++), src:src, w:w, h:h };
  state.images.push(item);
  renderTray();
  return item;
}
function renderTray(){
  trayEl.innerHTML='';
  if(state.images.length===0){
    trayEl.innerHTML = '<p class="tray-empty">No photos yet.</p>';
    return;
  }
  state.images.forEach(function(img){
    const div = document.createElement('div');
    div.className='tray-item';
    div.draggable=true;
    div.innerHTML = '<img src="'+img.src+'" alt="" draggable="false"><button type="button" class="tray-remove" title="Remove">×</button>';
    div.addEventListener('dragstart', function(e){
      e.dataTransfer.setData('text/tray-image', img.id);
      e.dataTransfer.effectAllowed='copy';
    });
    div.addEventListener('click', function(e){
      if(e.target.closest('.tray-remove')) return;
      if(state.selectedId){
        const sel = getEl(state.selectedId);
        if(sel && sel.type==='frame'){ assignImage(sel.id, img.src, img.w, img.h); pushHistory(); return; }
      }
      const w = Math.min(360, img.w);
      const h = w*(img.h/img.w);
      const fr = addFrame((state.canvasW-w)/2, (state.canvasH-h)/2, w, h);
      render();
      assignImage(fr.id, img.src, img.w, img.h);
      selectEl(fr.id);
      pushHistory();
    });
    div.querySelector('.tray-remove').addEventListener('click', function(e){
      e.stopPropagation();
      state.images = state.images.filter(function(i){ return i.id!==img.id; });
      renderTray();
    });
    trayEl.appendChild(div);
  });
}

/* ---- dropping directly onto the canvas ---- */
canvasEl.addEventListener('dragover', function(e){ e.preventDefault(); });
canvasEl.addEventListener('drop', async function(e){
  e.preventDefault();
  const rect = canvasEl.getBoundingClientRect();
  const dropX = (e.clientX-rect.left)/state.scale;
  const dropY = (e.clientY-rect.top)/state.scale;
  const targetNode = e.target.closest ? e.target.closest('.element.frame') : null;

  const trayId = e.dataTransfer.getData('text/tray-image');
  if(trayId){
    const img = state.images.find(function(i){ return i.id===trayId; });
    if(!img) return;
    if(targetNode){
      assignImage(targetNode.dataset.id, img.src, img.w, img.h);
    } else {
      const w = Math.min(360, img.w);
      const h = w*(img.h/img.w);
      const fr = addFrame(dropX-w/2, dropY-h/2, w, h);
      render();
      assignImage(fr.id, img.src, img.w, img.h);
      selectEl(fr.id);
    }
    pushHistory();
    return;
  }

  if(e.dataTransfer.files && e.dataTransfer.files.length){
    for(let i=0;i<e.dataTransfer.files.length;i++){
      const file = e.dataTransfer.files[i];
      if(!file.type || file.type.indexOf('image/')!==0) continue;
      const src = await readAsDataURL(file);
      const nimg = await loadImg(src);
      addToTray(src, nimg.naturalWidth, nimg.naturalHeight);
      if(targetNode){
        assignImage(targetNode.dataset.id, src, nimg.naturalWidth, nimg.naturalHeight);
      } else {
        const w = Math.min(360, nimg.naturalWidth);
        const h = w*(nimg.naturalHeight/nimg.naturalWidth);
        const fr = addFrame(dropX-w/2, dropY-h/2, w, h);
        render();
        assignImage(fr.id, src, nimg.naturalWidth, nimg.naturalHeight);
        selectEl(fr.id);
      }
    }
    pushHistory();
  }
});

/* ================= Layer order ================= */
function bringToFront(id){ const el=getEl(id); el.z = ++state.nextZ; updateNode(el); pushHistory(); }
function sendToBack(id){
  const minZ = Math.min.apply(null, state.els.map(function(e){ return e.z; }));
  const el = getEl(id); el.z = minZ-1; updateNode(el); pushHistory();
}
function bringForward(id){
  const sorted = state.els.slice().sort(function(a,b){ return a.z-b.z; });
  const idx = sorted.findIndex(function(e){ return e.id===id; });
  if(idx<sorted.length-1){
    const other = sorted[idx+1];
    const el = getEl(id);
    const tmp = el.z; el.z = other.z; other.z = tmp;
    updateNode(el); updateNode(other);
  }
  pushHistory();
}
function sendBackward(id){
  const sorted = state.els.slice().sort(function(a,b){ return a.z-b.z; });
  const idx = sorted.findIndex(function(e){ return e.id===id; });
  if(idx>0){
    const other = sorted[idx-1];
    const el = getEl(id);
    const tmp = el.z; el.z = other.z; other.z = tmp;
    updateNode(el); updateNode(other);
  }
  pushHistory();
}

/* ================= Layout presets ================= */
function gridRects(cols, rows, cw, ch, margin, gutter){
  const cellW = (cw - margin*2 - gutter*(cols-1))/cols;
  const cellH = (ch - margin*2 - gutter*(rows-1))/rows;
  const rects=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      rects.push({ x: margin + c*(cellW+gutter), y: margin + r*(cellH+gutter), w: cellW, h: cellH });
    }
  }
  return rects;
}
function clearCanvasSilently(){
  state.els=[]; state.selectedId=null; state.panZoomId=null; state.editingTextId=null; state.groupIds.clear();
}

function wireDropdown(btnId, panelId){
  const btn = $('#'+btnId), panel = $('#'+panelId);
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    const wasOpen = panel.classList.contains('open');
    closeDropdowns();
    if(!wasOpen) panel.classList.add('open');
  });
  panel.addEventListener('click', function(e){ e.stopPropagation(); });
}

/* ================= Save / Load project ================= */
$('#saveProjectBtn').addEventListener('click', function(){
  closeDropdowns();
  const data = {
    cutmat:true, version:1,
    canvasW: state.canvasW, canvasH: state.canvasH,
    bg: canvasEl.style.background, bgImage: canvasEl.style.backgroundImage,
    els: state.els, nextZ: state.nextZ, counter: state.counter
  };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  a.href=url; a.download='cutmat-project-'+stamp+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});
$('#loadProjectBtn').addEventListener('click', function(){ closeDropdowns(); loadProjectInput.click(); });
loadProjectInput.addEventListener('change', function(){
  const file = loadProjectInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      if(!data || !data.els){ alert("This file doesn't look like a CUTMAT project."); return; }
      state.groupMode=false; state.groupIds.clear();
      $('#groupModeBtn').classList.remove('active');
      state.canvasW = data.canvasW||1080; state.canvasH = data.canvasH||1080;
      state.els = data.els||[];
      const maxZ = state.els.reduce(function(m,e){ return Math.max(m, e.z||0); }, 0);
      state.nextZ = data.nextZ || (maxZ+1);
      state.counter = data.counter || (state.counter+1000);
      state.selectedId=null; state.panZoomId=null; state.editingTextId=null;
      recalcScale();
      canvasEl.style.background = data.bg||'#ffffff';
      canvasEl.style.backgroundImage = data.bgImage||'';
      render(); renderProps();
      pushHistory();
    } catch(err){
      alert('Could not read this project file.');
    }
  };
  reader.readAsText(file);
  loadProjectInput.value='';
});

async function exportPNG(){
  const btn = $('#exportBtn');
  const prevText = btn.textContent;
  btn.textContent='Preparing…'; btn.disabled=true;
  const prevSelected = state.selectedId;
  const wasGroupMode = state.groupMode;
  selectEl(null);
  if(wasGroupMode) toggleGroupMode();
  exitPanZoom(false);
  render();

  const originalParent = canvasEl.parentNode;
  const originalNextSibling = canvasEl.nextSibling;
  const originalTransform = canvasEl.style.transform;

  const stage2 = document.createElement('div');
  stage2.style.position='fixed';
  stage2.style.left='-99999px';
  stage2.style.top='0';
  stage2.style.width = state.canvasW+'px';
  stage2.style.height = state.canvasH+'px';
  document.body.appendChild(stage2);
  canvasEl.style.transform='none';
  stage2.appendChild(canvasEl);

  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(function(r){ requestAnimationFrame(r); });
    const shot = await html2canvas(canvasEl, {
      backgroundColor: null,
      scale: 1,
      useCORS: true,
      width: state.canvasW,
      height: state.canvasH,
      ignoreElements: function(node){
        return node.classList && (
          node.classList.contains('handle') ||
          node.classList.contains('delete-btn') ||
          node.classList.contains('panzoom-hint') ||
          node.classList.contains('text-edit') ||
          node.classList.contains('rotate-handle') ||
          node.classList.contains('rotate-stem') ||
          node.classList.contains('export-hidden')
        );
      }
    });
    await new Promise(function(resolve){
      shot.toBlob(function(blob){
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
        a.href=url; a.download='collage-'+stamp+'.png';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        resolve();
      }, 'image/png');
    });
    btn.textContent='Downloaded ✓';
    setTimeout(function(){ btn.textContent=prevText; btn.disabled=false; }, 1800);
  } catch(err){
    console.error(err);
    btn.textContent='Export failed — try again';
    setTimeout(function(){ btn.textContent=prevText; btn.disabled=false; }, 2200);
  } finally {
    if(originalNextSibling) originalParent.insertBefore(canvasEl, originalNextSibling);
    else originalParent.appendChild(canvasEl);
    canvasEl.style.transform = originalTransform;
    stage2.remove();
    if(prevSelected) selectEl(prevSelected);
  }
}

/* ================= Init ================= */
canvasEl.style.background = '#ffffff';
buildLayoutsMenu();
recalcScale();
renderTray();
render();
renderProps();
pushHistory();

})();
</script>
</body>
</html>
